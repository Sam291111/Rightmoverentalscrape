name: London Rental Pipeline

on:
  workflow_dispatch:
    inputs:
      pages:
        description: Search result pages per postcode search unit (`0` means auto-paginate until the site stops)
        type: number
        required: false
        default: 0
      max_results:
        description: Maximum listings per postcode search unit before enrichment (`0` means no cap)
        type: number
        required: false
        default: 0
      search_chunk_size:
        description: Postcode searches per search job chunk
        type: number
        required: false
        default: 12
      detail_chunk_size:
        description: Listings per detail enrichment chunk
        type: number
        required: false
        default: 400
  schedule:
    - cron: "0 6 * * 1,4"

permissions:
  contents: write

concurrency:
  group: london-rental-pipeline
  cancel-in-progress: false

jobs:
  search_manifest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      search_chunk_matrix: ${{ steps.manifest.outputs.search_chunk_matrix }}
      search_chunk_count: ${{ steps.manifest.outputs.search_chunk_count }}
      chunk_matrix: ${{ steps.manifest.outputs.chunk_matrix }}
      chunk_count: ${{ steps.manifest.outputs.chunk_count }}
      pages: ${{ steps.params.outputs.pages }}
      max_results: ${{ steps.params.outputs.max_results }}
      search_chunk_size: ${{ steps.params.outputs.search_chunk_size }}
      detail_chunk_size: ${{ steps.params.outputs.detail_chunk_size }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Resolve run parameters
        id: params
        shell: bash
        run: |
          normalise_int() {
            local value="$1"
            local fallback="$2"
            if ! [[ "$value" =~ ^[0-9]+$ ]]; then
              value="$fallback"
            fi
            if [ "$value" -lt 0 ]; then
              value="$fallback"
            fi
            echo "$value"
          }

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            pages="$(normalise_int "${{ inputs.pages }}" 0)"
            max_results="$(normalise_int "${{ inputs.max_results }}" 0)"
            search_chunk_size="$(normalise_int "${{ inputs.search_chunk_size }}" 12)"
            detail_chunk_size="$(normalise_int "${{ inputs.detail_chunk_size }}" 400)"
            if [ "$search_chunk_size" -lt 1 ]; then
              search_chunk_size=12
            fi
            if [ "$detail_chunk_size" -lt 1 ]; then
              detail_chunk_size=400
            fi
          else
            pages=0
            max_results=0
            search_chunk_size=12
            detail_chunk_size=400
          fi

          echo "pages=$pages" >> "$GITHUB_OUTPUT"
          echo "max_results=$max_results" >> "$GITHUB_OUTPUT"
          echo "search_chunk_size=$search_chunk_size" >> "$GITHUB_OUTPUT"
          echo "detail_chunk_size=$detail_chunk_size" >> "$GITHUB_OUTPUT"
          echo "Using pages=$pages max_results=$max_results search_chunk_size=$search_chunk_size detail_chunk_size=$detail_chunk_size"

      - name: Build adaptive search chunk manifest
        id: manifest
        run: |
          mkdir -p .workflow/dispatch
          python Scraper/build_adaptive_search_chunk_manifest.py \
            --searches-per-chunk "${{ steps.params.outputs.search_chunk_size }}" \
            --output .workflow/dispatch/search_chunk_manifest.json
          search_chunk_matrix="$(python3 -c 'import json, pathlib; data=json.loads(pathlib.Path(".workflow/dispatch/search_chunk_manifest.json").read_text()); print(json.dumps(data["include"]))')"
          search_chunk_count="$(python3 -c 'import json, pathlib; data=json.loads(pathlib.Path(".workflow/dispatch/search_chunk_manifest.json").read_text()); print(data["chunk_count"])')"
          echo "search_chunk_matrix=$search_chunk_matrix" >> "$GITHUB_OUTPUT"
          echo "search_chunk_count=$search_chunk_count" >> "$GITHUB_OUTPUT"
          echo "chunk_matrix=[]" >> "$GITHUB_OUTPUT"
          echo "chunk_count=0" >> "$GITHUB_OUTPUT"
          echo "Search chunk count: $search_chunk_count"

  search_chunks:
    needs: search_manifest
    if: ${{ needs.search_manifest.outputs.search_chunk_count != '0' }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        chunk: ${{ fromJson(needs.search_manifest.outputs.search_chunk_matrix) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r Scraper/requirements.txt

      - name: Run adaptive rental search chunk
        env:
          SEARCH_UNITS_JSON: ${{ toJson(matrix.chunk.search_units) }}
        run: |
          mkdir -p ".workflow/search/${{ matrix.chunk.chunk_label }}"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          search_units = json.loads(os.environ["SEARCH_UNITS_JSON"])
          outcodes = [unit["outcode"] for unit in search_units if unit.get("outcode")]
          Path(".workflow/search/seed_outcodes.txt").write_text(
              ("\n".join(outcodes) + ("\n" if outcodes else "")),
              encoding="utf-8",
          )
          PY
          search_args=()
          while IFS= read -r outcode || [ -n "$outcode" ]; do
            if [ -n "$outcode" ]; then
              search_args+=(--seed-outcode "$outcode")
            fi
          done < .workflow/search/seed_outcodes.txt
          python Scraper/run_adaptive_london_rental_search.py \
            --pages "${{ needs.search_manifest.outputs.pages }}" \
            --max-results "${{ needs.search_manifest.outputs.max_results }}" \
            --output-dir ".workflow/search/${{ matrix.chunk.chunk_label }}/output" \
            --headless \
            --run-dir ".workflow/search/${{ matrix.chunk.chunk_label }}/run" \
            --user-data-dir ".workflow/search/${{ matrix.chunk.chunk_label }}/browser_profile" \
            "${search_args[@]}"

      - name: Upload search chunk artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.chunk.chunk_label }}
          path: |
            .workflow/search/${{ matrix.chunk.chunk_label }}/output
            .workflow/search/${{ matrix.chunk.chunk_label }}/run
          if-no-files-found: warn
          retention-days: 14

  search_finalize:
    needs:
      - search_manifest
      - search_chunks
    if: ${{ always() && needs.search_manifest.result == 'success' && needs.search_chunks.result != 'cancelled' && needs.search_manifest.outputs.search_chunk_count != '0' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120

    outputs:
      chunk_matrix: ${{ steps.manifest.outputs.chunk_matrix }}
      chunk_count: ${{ steps.manifest.outputs.chunk_count }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r Scraper/requirements.txt

      - name: Download search chunk artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: search-*
          path: .workflow/search_chunks

      - name: Rebuild search chunk manifest
        run: |
          python Scraper/build_adaptive_search_chunk_manifest.py \
            --searches-per-chunk "${{ needs.search_manifest.outputs.search_chunk_size }}" \
            --output .workflow/search_chunks/expected_search_chunk_manifest.json

      - name: Merge search chunks
        run: |
          mkdir -p .workflow/search_bundle
          python Scraper/merge_rental_search_chunks.py \
            --input-dir .workflow/search_chunks \
            --manifest-json .workflow/search_chunks/expected_search_chunk_manifest.json \
            --output-dir .workflow/search_bundle

      - name: Prepare merged search bundle and detail manifest
        id: manifest
        shell: bash
        run: |
          search_json="$(ls -t .workflow/search_bundle/rightmove_rental_search_results_*.json | head -n1)"
          search_csv="$(ls -t .workflow/search_bundle/rightmove_rental_search_results_*.csv | head -n1)"
          cp "$search_json" .workflow/search_bundle/search_results.json
          cp "$search_csv" .workflow/search_bundle/search_results.csv
          python Scraper/build_rental_detail_chunk_manifest.py \
            --search-results-json .workflow/search_bundle/search_results.json \
            --chunk-size "${{ needs.search_manifest.outputs.detail_chunk_size }}" \
            --output .workflow/search_bundle/chunk_manifest.json
          chunk_matrix="$(python3 -c 'import json, pathlib; data=json.loads(pathlib.Path(".workflow/search_bundle/chunk_manifest.json").read_text()); print(json.dumps(data["include"]))')"
          chunk_count="$(python3 -c 'import json, pathlib; data=json.loads(pathlib.Path(".workflow/search_bundle/chunk_manifest.json").read_text()); print(data["chunk_count"])')"
          echo "chunk_matrix=$chunk_matrix" >> "$GITHUB_OUTPUT"
          echo "chunk_count=$chunk_count" >> "$GITHUB_OUTPUT"
          echo "Detail chunk count: $chunk_count"

      - name: Upload search artifact
        uses: actions/upload-artifact@v4
        with:
          name: rental-search-bundle
          path: .workflow/search_bundle
          if-no-files-found: error
          retention-days: 14

  detail_chunks:
    needs: search_finalize
    if: ${{ needs.search_finalize.outputs.chunk_count != '0' }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        chunk: ${{ fromJson(needs.search_finalize.outputs.chunk_matrix) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r Scraper/requirements.txt

      - name: Download search artifact
        uses: actions/download-artifact@v4
        with:
          name: rental-search-bundle
          path: .workflow/search_bundle

      - name: Run rental detail chunk
        run: |
          mkdir -p ".workflow/detail/${{ matrix.chunk.chunk_label }}"
          python Scraper/rightmove_rental_detail_scraper.py \
            --search-results-json .workflow/search_bundle/search_results.json \
            --start-index "${{ matrix.chunk.start_index }}" \
            --end-index "${{ matrix.chunk.end_index }}" \
            --output-dir ".workflow/detail/${{ matrix.chunk.chunk_label }}/output" \
            --run-dir ".workflow/detail/${{ matrix.chunk.chunk_label }}/checkpoint" \
            --no-interactive \
            --headless \
            --user-data-dir ".workflow/detail/${{ matrix.chunk.chunk_label }}/browser_profile"

      - name: Upload detail chunk artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: detail-${{ matrix.chunk.chunk_label }}
          path: |
            .workflow/detail/${{ matrix.chunk.chunk_label }}/output
            .workflow/detail/${{ matrix.chunk.chunk_label }}/checkpoint
          if-no-files-found: warn
          retention-days: 14

  finalize:
    needs:
      - search_finalize
      - detail_chunks
    if: ${{ always() && needs.search_finalize.result == 'success' && needs.detail_chunks.result != 'cancelled' }}
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r Scraper/requirements.txt

      - name: Download search artifact
        uses: actions/download-artifact@v4
        with:
          name: rental-search-bundle
          path: .workflow/search_bundle

      - name: Download detail chunk artifacts
        if: ${{ needs.search_finalize.outputs.chunk_count != '0' }}
        uses: actions/download-artifact@v4
        with:
          pattern: detail-*
          path: .workflow/detail_chunks

      - name: Merge enriched chunks
        run: |
          python Scraper/merge_rental_enriched_chunks.py \
            --input-dir .workflow/detail_chunks \
            --search-results-json .workflow/search_bundle/search_results.json \
            --chunk-manifest-json .workflow/search_bundle/chunk_manifest.json \
            --output-dir Scraper/output

      - name: Clean merged dataset
        run: |
          enriched_json="$(ls -t Scraper/output/rightmove_rental_enriched_results_*.json | head -n1)"
          python Scraper/clean_rightmove_dataset.py \
            --input "$enriched_json" \
            --output-dir Scraper/output

      - name: Clip cleaned dataset to London
        run: |
          cleaned_json="$(python3 -c "from pathlib import Path; files=sorted([p for p in Path('Scraper/output').glob('rightmove_cleaned_dataset_*.json') if '_qc_' not in p.name], key=lambda p: p.stat().st_mtime, reverse=True); print(files[0])")"
          python Scraper/clip_rightmove_dataset_to_london.py \
            --input "$cleaned_json" \
            --boundary-path "London Boundary/gla/London_GLA_Boundary.shp" \
            --boroughs-path "London Boundary/statistical-gis-boundaries-london/ESRI/London_Borough_Excluding_MHW.shp" \
            --output-dir Scraper/output

      - name: Organise output directory
        run: |
          python Scraper/organise_london_rental_outputs.py \
            --output-dir Scraper/output

      - name: Rebuild history and dashboard data
        run: |
          python Scraper/build_london_rental_history.py \
            --input-dir Scraper/output \
            --output-dir Scraper/output/history \
            --pages-data-dir docs/data

      - name: Upload outputs artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: london-rental-output
          path: |
            Scraper/output
            docs/data
          if-no-files-found: warn
          retention-days: 14

      - name: Commit updated outputs
        shell: bash
        run: |
          if git diff --quiet -- Scraper/output/history docs/data; then
            echo "No lightweight history or dashboard changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Scraper/output/history docs/data
          git commit -m "Update London rental history and dashboard data"
          for attempt in 1 2 3; do
            echo "Sync/push attempt $attempt"
            if ! git pull --rebase origin main; then
              git rebase --abort || true
              if [ "$attempt" -eq 3 ]; then
                echo "Rebase failed after 3 attempts."
                exit 1
              fi
              sleep 5
              continue
            fi
            if git push origin HEAD:main; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "Push failed after 3 attempts."
              exit 1
            fi
            sleep 5
          done
