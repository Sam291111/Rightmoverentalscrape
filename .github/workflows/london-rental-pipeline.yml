name: London Rental Pipeline

on:
  workflow_dispatch:
    inputs:
      pages:
        description: Search result pages to scrape
        required: false
        default: "2"
      max_results:
        description: Maximum listings to keep before enrichment
        required: false
        default: "40"
  schedule:
    - cron: "0 6 * * 1,4"

permissions:
  contents: write

concurrency:
  group: london-rental-pipeline
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r Scraper/requirements.txt

      - name: Resolve run parameters
        id: params
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "pages=${{ inputs.pages }}" >> "$GITHUB_OUTPUT"
            echo "max_results=${{ inputs.max_results }}" >> "$GITHUB_OUTPUT"
          else
            echo "pages=12" >> "$GITHUB_OUTPUT"
            echo "max_results=250" >> "$GITHUB_OUTPUT"
          fi

      - name: Run London rental pipeline
        run: |
          python Scraper/run_london_rental_pipeline.py \
            --pages "${{ steps.params.outputs.pages }}" \
            --max-results "${{ steps.params.outputs.max_results }}"

      - name: Upload outputs artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: london-rental-output
          path: |
            Scraper/output
          if-no-files-found: warn
          retention-days: 14

      - name: Commit updated outputs
        shell: bash
        run: |
          if git diff --quiet -- Scraper/output; then
            echo "No output changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Scraper/output
          git commit -m "Update London rental outputs"
          git push
